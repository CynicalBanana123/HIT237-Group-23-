{% extends "base.html" %}

{% block content %}
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
      {{ form.username.label_tag }}<br>
      {{ form.username }}
    </div>
    <div>
      {{ form.password.label_tag }}<br>
      {{ form.password }}
    </div>
    <button type="submit">Login</button>
  </form>
  <p style="margin-top:1em;">
    New here? <a href="{% url 'accounts:signup' %}">Create an account</a>
  </p>
{% endblock %}
