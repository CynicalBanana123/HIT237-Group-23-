{% extends "base.html" %}

{% block content %}
  <h2>My Tickets</h2>
  <p><a href="{% url 'dashboard:home' %}">&larr; Back to dashboard</a></p>
  <p><a href="{% url 'tickets:create' %}">Create new ticket</a></p>
  <ul>
    {% for t in tickets %}
      <li>{{ t.created_at|date:"Y-m-d H:i" }} - {{ t.title }} ({{ t.status }})</li>
    {% empty %}
      <li>No tickets yet.</li>
    {% endfor %}
  </ul>
{% endblock %}
