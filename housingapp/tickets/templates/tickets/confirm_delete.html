{% extends "base.html" %}

{% block content %}
  <h2>Confirm Delete</h2>
  <p>Are you sure you want to delete ticket "{{ ticket.title }}"?</p>
  <form method="post" action="{% url 'tickets:delete' ticket.pk %}">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'accounts:home' %}">Cancel</a>
  </form>
{% endblock %}
