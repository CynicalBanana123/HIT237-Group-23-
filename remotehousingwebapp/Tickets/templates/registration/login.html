<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Remote Housing</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f4f7fb, #e3edf7);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      border: 1px solid #e6ecf2;
    }

    .login-wrapper h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #12395b;
    }

    .login-wrapper p.description {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 25px;
    }

    form p {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #1976d2;
      outline: none;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }

    .login-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1976d2;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .login-btn:hover {
      background: #125ea9;
    }

    .links {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .links a {
      display: inline-block;
      margin: 5px 8px;
      text-decoration: none;
      color: #1976d2;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error-box {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #fdecea;
      border: 1px solid #f5c2c0;
      color: #c62828;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .login-wrapper {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">
    <h1>Log in</h1>
    <p class="description">
      Sign in with your user account. For admin access use the Admin link.
    </p>

    {% if form.errors %}
      <div class="error-box">
        Invalid username or password
      </div>
    {% endif %}

    <form method="post" action=".">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="login-btn">Log in</button>
    </form>

    <div class="links">
      <a href="/admin/">Admin login</a>
      <a href="/">Back to home</a>
    </div>
  </div>

</body>
</html>
